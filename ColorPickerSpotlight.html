<div style="font-family:system-ui;max-width:560px;margin:24px auto;text-align:center">
  <h2>Color Picker Spotlight</h2>
  <input id="picker" type="color" value="#4f46e5" style="width:120px;height:60px;border:none">
  <div id="ball" style="
      margin:20px auto;width:140px;height:140px;border-radius:50%;
      box-shadow:0 0 40px rgba(0,0,0,.25) inset, 0 20px 40px rgba(0,0,0,.15);
      background:#4f46e5; transition:transform .2s, background .2s;">
  </div>
  <p style="color:#555">Pick a color and hover over the circle ✨</p>
</div>

<script>
  const ball = document.getElementById('ball');
  const picker = document.getElementById('picker');

  picker.addEventListener('input', () => {
    ball.style.background = picker.value;
    document.body.style.background = picker.value + '20';
  });

  ball.addEventListener('mousemove', (e) => {
    // parallax wobble
    const r = ball.getBoundingClientRect();
    const dx = ((e.clientX - (r.left + r.width/2)) / r.width) * 12;
    const dy = ((e.clientY - (r.top + r.height/2)) / r.height) * 12;
    ball.style.transform = `translate(${dx}px, ${dy}px)`;
  });
  ball.addEventListener('mouseleave', () => ball.style.transform = 'translate(0,0)');
</script>
