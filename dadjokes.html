<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terribly Designed Dad Joke Machine</title>
  <style>
    /* intentionally questionable styles :) */
    body { background:#aaff00; font-family:"Comic Sans MS", cursive, sans-serif; }
    #app { width:350px; border:5px dotted hotpink; padding:7px; margin:40px 0 0 12px; }
    h1 { color:red; letter-spacing:8px; text-shadow:2px 2px 0 yellow; }
    #joke { min-height:90px; background:white; border:3px ridge #333; padding:6px; overflow:scroll; }
    button { font-size:28px; background:linear-gradient(90deg, magenta, cyan); border:4px double black; width:100%; cursor:pointer; }
    .tiny { font-size:10px; color:#444; }
    label { display:block; margin-top:8px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Dad Jokes!!!</h1>
    <p class="tiny">tip: keep clicking until it's funny</p>

    <div id="joke">Press the big button!</div>

    <!-- Inline handler on purpose to keep it gloriously messy -->
    <button onclick="showJoke()">Generate!!!</button>

    <!-- Random useless control to clutter the UI -->
    <label>unused input: <input type="text" placeholder="type anything" /></label>

    <p id="counter" class="tiny">Jokes shown: 0</p>

    <!-- TODO: room for improvement: fetch jokes from API, better layout, accessibility, keyboard support, cleaner JS, nicer colors, debounce, history, favorites, etc. -->
  </div>

  <script>
    // Global variables because why not :)
    var dadJokes = [
      "Why don't skeletons fight each other? They don't have the guts.",
      "I would avoid the sushi if I was you. It's a little fishy.",
      "I used to hate facial hair, but then it grew on me.",
      "Want to hear a joke about construction? I'm still working on it.",
      "I ordered a chicken and an egg from Amazon. I'll let you know.",
      "I used to play piano by ear, now I use my hands.",
      "I'm reading a book about anti-gravity. It's impossible to put down.",
      "Did you hear about the restaurant on the moon? Great food, no atmosphere.",
      "I got hit in the head with a can of soda. Lucky it was a soft drink.",
      "I only know 25 letters of the alphabet. I don't know y."
    ];

    // Simple cache to store fetched jokes
    var jokeCache = [];

    function showJoke() {
      var jokeElement = document.getElementById('joke');
      
      // Show loading message
      jokeElement.innerText = 'Loading joke...';
      
      // Fetch joke from API
      fetch('https://icanhazdadjoke.com/', {
        headers: {
          'Accept': 'application/json'
        }
      })
      .then(function(response) {
        if (!response.ok) {
          throw new Error('API request failed');
        }
        return response.json();
      })
      .then(function(data) {
        // Display the joke from API
        jokeElement.innerText = data.joke;
        
        // Cache the joke
        if (jokeCache.indexOf(data.joke) === -1) {
          jokeCache.push(data.joke);
        }
        
        // Bad UX flourish: always force scroll to the top
        jokeElement.scrollTop = 0;
        
        // Sloppy global state counter
        window.jokeCount = (window.jokeCount || 0) + 1;
        document.getElementById('counter').innerText = 'Jokes shown: ' + window.jokeCount;
      })
      .catch(function(error) {
        // Fallback to cached jokes or hardcoded jokes on error
        var fallbackJokes = jokeCache.length > 0 ? jokeCache : dadJokes;
        var i = Math.floor(Math.random() * fallbackJokes.length);
        jokeElement.innerText = fallbackJokes[i];
        
        // Bad UX flourish: always force scroll to the top
        jokeElement.scrollTop = 0;
        
        // Sloppy global state counter
        window.jokeCount = (window.jokeCount || 0) + 1;
        document.getElementById('counter').innerText = 'Jokes shown: ' + window.jokeCount;
      });
    }
  </script>
</body>
</html>
