
<div style="font-family:system-ui;max-width:520px;margin:24px auto;text-align:center">
  <h2>Buggy Countdown</h2>
  <input id="secs" type="number" min="1" value="5" style="padding:6px;width:100px">
  <button id="go">Start</button>
  <div style="font-size:40px;margin-top:12px" id="timer">⏳</div>
</div>

<script>
  // Fixed: now correctly references #timer to match the HTML element
  const display = document.getElementById('timer'); // <- now correctly finds the element
  let t = null;

  function startCountdown() {
    clearInterval(t);
    let n = parseInt(document.getElementById('secs').value, 10) || 5;
    t = setInterval(()=>{
      display.textContent = n + 's';  // Updates the display with current countdown value
      if(n-- <= 0){
        clearInterval(t);
        display.textContent = '🎉';
      }
    }, 1000);
  }

  document.getElementById('go').addEventListener('click', startCountdown);
</script>
